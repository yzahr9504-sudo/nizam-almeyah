<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خانة المشتركين</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
*{box-sizing:border-box;font-family:Tahoma}
body{margin:0;background:#eef2ff;padding:10px}
.btn{border:none;padding:10px 14px;border-radius:12px;color:#fff;font-weight:bold;cursor:pointer;margin:4px;font-size:13px}
.green{background:#16a34a}.orange{background:#f59e0b}.blue{background:#0ea5e9}
.purple{background:#7c3aed}.gray{background:#64748b}.darkgreen{background:#0f766e}
.search-box{display:flex;gap:6px;margin-bottom:10px}
.search-box input{flex:1;padding:10px;border-radius:12px;border:1px solid #ccc}
.card{background:#fff;border-radius:16px;padding:12px}
.flex-wrap{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:100}
.modal-content{background:#fff;padding:16px;border-radius:16px;width:92%;max-width:400px}
.modal-content input{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:10px}
</style>
</head>
<body>

<h2>👥 خانة المشتركين</h2>

<div class="search-box">
<button class="btn green" onclick="openAdd()">+ إضافة</button>
<input id="search" placeholder="🔍 بحث بالاسم أو رقم العداد/المحل" oninput="render()">
</div>

<div class="flex-wrap">
<button class="btn orange" onclick="importCSV()">📥 استيراد CSV</button>
<button class="btn blue" onclick="exportCSV()">📤 تصدير CSV لبرنامج Excel</button>
<button class="btn purple" onclick="importPDF()">📄 استيراد مشتركين PDF</button>
</div>

<div class="flex-wrap">
<button class="btn gray" onclick="selectVisible()">☑ تحديد الظاهر</button>
<button class="btn darkgreen" onclick="exportPDFFiltered()">🖨 تصدير المشتركين PDF</button>
</div>

<div class="flex-wrap">
<button class="btn purple" onclick="exportSelectedPDF()">▦ تصدير المحدد PDF</button>
<button class="btn gray" onclick="clearSelection()">☐ إلغاء التحديد</button>
<button class="btn darkgreen" onclick="exportAllPDF()">▦ تصدير الكل PDF</button>
</div>

<div style="color:#7c3aed;font-weight:bold;text-align:right">الباركودات المحددة: <span id="selectedCount">0</span></div>

<div class="card">
<div id="list"></div>
<div id="empty" style="text-align:center;color:#666;padding:20px">لا يوجد مشتركون حتى الآن.<br>اضغط «+ إضافة» لإضافة أول مشترك.</div>
</div>

<input type="file" id="fileInput" accept=".csv,.txt" style="display:none" onchange="handleCSV(this)">

<div class="modal" id="addModal">
<div class="modal-content">
<h3>+ إضافة مشترك</h3>
<input id="m_name" placeholder="اسم المشترك">
<input id="m_number" placeholder="رقم العداد / المحل">
<input id="m_phone" placeholder="رقم الهاتف (مثال 711023989)">
<input id="m_extra" placeholder="بيانات إضافية">
<button class="btn green" style="width:100%" onclick="saveSubscriber()">💾 حفظ</button>
<button class="btn" style="width:100%;background:#e5e7eb;color:#000;margin-top:6px" onclick="closeAdd()">إلغاء</button>
</div>
</div>

<script>
let subscribers=JSON.parse(localStorage.getItem('water_subscribers_v2')||'[]');
function persist(){localStorage.setItem('water_subscribers_v2',JSON.stringify(subscribers));}
function openAdd(){document.getElementById('addModal').style.display='flex';}
function closeAdd(){document.getElementById('addModal').style.display='none';}
function saveSubscriber(){
  const name=document.getElementById('m_name').value.trim();
  if(!name){alert('اكتب الاسم');return;}
  subscribers.push({id:Date.now(),name,number:document.getElementById('m_number').value,phone:document.getElementById('m_phone').value,extra:document.getElementById('m_extra').value,selected:false});
  persist();closeAdd();render();
  document.getElementById('m_name').value='';document.getElementById('m_number').value='';document.getElementById('m_phone').value='';
}
function render(){
  const q=document.getElementById('search').value.toLowerCase();
  const list=document.getElementById('list');list.innerHTML='';
  const filtered=subscribers.filter(s=>!q||(s.name+s.number+s.phone).toLowerCase().includes(q));
  document.getElementById('empty').style.display=filtered.length? 'none':'block';
  filtered.forEach(s=>{
    const d=document.createElement('div');d.style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee";
    d.innerHTML=`<label><input type="checkbox" ${s.selected?'checked':''} onchange="toggleSelect(${s.id},this.checked)"> ${s.name} - ${s.number} - ${s.phone}</label><button onclick="deleteSub(${s.id})" style="border:none;background:#fee;color:#c00;padding:4px 8px;border-radius:8px">حذف</button>`;
    list.appendChild(d);
  });
  document.getElementById('selectedCount').innerText=subscribers.filter(s=>s.selected).length;
}
function toggleSelect(id,c){const s=subscribers.find(x=>x.id===id);if(s)s.selected=c;persist();render();}
function deleteSub(id){if(confirm('حذف؟')){subscribers=subscribers.filter(x=>x.id!==id);persist();render();}}
function selectVisible(){const q=document.getElementById('search').value.toLowerCase();subscribers.forEach(s=>{if(!q||(s.name+s.number+s.phone).toLowerCase().includes(q))s.selected=true;});persist();render();}
function clearSelection(){subscribers.forEach(s=>s.selected=false);persist();render();}
function exportCSV(){if(!subscribers.length){alert('لا يوجد بيانات');return;}let csv="\uFEFFاسم,عداد,هاتف,اضافي\n";subscribers.forEach(s=>{csv+=`"${s.name}","${s.number}","${s.phone}","${s.extra}"\n`;});download(csv,'المشتركين.csv','text/csv');}
function importCSV(){document.getElementById('fileInput').click();}
function handleCSV(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{e.target.result.split('\n').forEach((line,i)=>{if(i===0||!line.trim())return;const p=line.split(',').map(x=>x.replace(/"/g,'').trim());if(p[0])subscribers.push({id:Date.now()+i,name:p[0],number:p[1],phone:p[2],extra:p[3],selected:false});});persist();render();alert('تم');};r.readAsText(f,'UTF-8');input.value='';}
function download(c,f,m){const b=new Blob([c],{type:m});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=f;a.click();URL.revokeObjectURL(u);}
async function exportAllPDF(){exportToPDF(subscribers,'الكل');}
async function exportPDFFiltered(){const q=document.getElementById('search').value.toLowerCase();exportToPDF(subscribers.filter(s=>!q||(s.name+s.number+s.phone).toLowerCase().includes(q)),'الظاهر');}
async function exportSelectedPDF(){const sel=subscribers.filter(s=>s.selected);if(!sel.length){alert('حدد مشترك');return;}exportToPDF(sel,'المحدد');}
async function exportToPDF(data,title){try{const{jsPDF}=window.jspdf;const doc=new jsPDF({orientation:'landscape'});doc.text(`تصدير ${title}`,14,14);doc.autoTable({head:[['#','الاسم','العداد','الهاتف']],body:data.map((s,i)=>[i+1,s.name,s.number,s.phone]),startY:20});doc.save(`${title}.pdf`);}catch(e){let h=`<table border=1><tr><th>الاسم</th><th>العداد</th><th>الهاتف</th></tr>`;data.forEach(s=>h+=`<tr><td>${s.name}</td><td>${s.number}</td><td>${s.phone}</td></tr>`);h+=`</table>`;const w=window.open('');w.document.write(h);w.print();}}
function importPDF(){alert('استيراد PDF قريباً');}
render();
</script>
</body>
</html>
