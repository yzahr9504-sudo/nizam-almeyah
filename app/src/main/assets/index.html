<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام المياه</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f5f7;
            margin: 0;
            padding: 15px;
            color: #222;
        }

        h1 {
            text-align: center;
            color: #087b45;
        }

        .card {
            background: white;
            padding: 15px;
            margin: 12px 0;
            border-radius: 12px;
            box-shadow: 0 2px 6px #ddd;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            font-size: 16px;
            border-radius: 8px;
        }

        input {
            border: 1px solid #ccc;
        }

        button {
            border: none;
            background: #087b45;
            color: white;
            font-weight: bold;
        }

        .delete {
            background: #c62828;
        }

        .subscriber {
            border-bottom: 1px solid #ddd;
            padding: 10px 0;
        }
    </style>
</head>
