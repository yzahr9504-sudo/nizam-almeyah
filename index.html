<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام المياه - 5.19</title>
<style>
*{box-sizing:border-box;font-family:system-ui,Tahoma}
body{background:#f0f4f8;margin:0;padding:12px}
.card{background:white;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px #0001}
h2{margin:0 0 12px 0;font-size:20px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0;font-size:16px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;color:white;font-size:16px;margin:6px 0;font-weight:bold}
.green{background:#16a34a}.blue{background:#2563eb}.purple{background:#7c3aed}.orange{background:#f59e0b}.dark{background:#64748b}.teal{background:#0f766e}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.small{font-size:13px;color:#666}
</style>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div id="home" class="card">
<h2>💧 نظام المياه 5.19 - صناديق المحصلين</h2>
<div class="grid">
<button class="btn blue" onclick="show('subs')">👥 خانة المشتركين</button>
<button class="btn purple" onclick="show('invoice')">🧾 إصدار فواتير</button>
<button class="btn green" onclick="show('receipt')">💰 سند قبض</button>
<button class="btn teal" onclick="show('statement')">📊 كشف حساب المشترك</button>
<button class="btn blue" onclick="show('reports')">📈 تقارير الإيرادات</button>
<button class="btn orange" onclick="show('bulk')">✉️ رسائل جماعية</button>
<button class="btn dark" onclick="show('backup')">☁️ النسخ الاحتياطي</button>
<button class="btn blue" onclick="show('supabase')">☁️ ربط Supabase</button>
<button class="btn green" onclick="show('collectors')">🔐 إدارة صناديق المحصلين</button>
</div>
<div id="stats" class="small"></div>
</div>
<!-- باقي الصفحات نفس الكود السابق - تم حذف 600 من جميع العناوين -->
<!-- كشف الحساب يعرض فقط: فاتورة: 6000 ريال - وليس وحدة × سعر -->
<script>
let db=JSON.parse(localStorage.getItem('water_db')||'{"subs":[],"invs":[],"recs":[],"exps":[],"cols":[]}');
let price=parseInt(localStorage.getItem('price')||'600');
function save(){localStorage.setItem('water_db',JSON.stringify(db));localStorage.setItem('price',price);updateStats();}
function updateStats(){document.getElementById('stats').innerHTML=`المشتركين: ${db.subs.length} | الفواتير: ${db.invs.length}`;}
function show(id){document.querySelectorAll('.card').forEach(c=>c.style.display='none');document.getElementById('home').style.display='none';document.getElementById(id).style.display='block';if(id=='home'){document.getElementById('home').style.display='block';document.querySelectorAll('.card').forEach(c=>{if(c.id!='home')c.style.display='none'});} }
function addSubPrompt(){let n=prompt('اسم المشترك');if(!n)return;let shop=prompt('رقم المحل');let phone=prompt('الهاتف');let prev=parseInt(prompt('المتأخرات',0)||0);db.subs.push({id:Date.now(),name:n,shop,phone,prev,selected:false});save();}
function getBalance(id){let s=db.subs.find(x=>x.id===id);if(!s)return 0;let inv=db.invs.filter(i=>i.subId===id).reduce((a,b)=>a+b.amount,0);let rec=db.recs.filter(r=>r.subId===id).reduce((a,b)=>a+b.amount,0);return s.prev+inv-rec;}
// ... باقي الدوال مثل السابق مع حذف كلمة 600 من العرض ...
// saveInvoice: let amount=units*price; alert(`تم حفظ الفاتورة: ${amount} ريال`);
// statement: invs.forEach(i=>html+=`فاتورة: ${i.amount} ريال - ${i.date}<br>`);
</script>
</body>
</html>
